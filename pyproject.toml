[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opendmp"
version = "0.0.1"
description = "A Python-like language, compiler and timed emulator for the InvenSense DMP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bench = ["pyserial>=3.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["opendmp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
